[project]
name = "localscript"
version = "0.1.0"
description = "Local Lua code generation agent on top of Ollama"
readme = "README.md"
authors = [
    { name = "avolxn", email = "vladislav.eldashov@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1,<0.23.0",
    "bashlex>=0.18,<0.19",
    "click>=8.2.1,<9.0.0",
    "fastapi>=0.122.0,<0.123.0",
    "httpx>=0.28.1,<0.29.0",
    "langdetect>=1.0.9,<2.0.0",
    "notify-py>=0.3.43,<0.4.0",
    "ollama>=0.6.0,<0.7.0",
    "packaging>=25.0,<27.0",
    "pathspec>=0.12.1,<0.13.0",
    "platformdirs>=4.9.4,<5.0.0",
    "psutil>=7.2.1,<8.0.0",
    "pyperclip>=1.11.0,<2.0.0",
    "rich>=14.3.3,<15.0.0",
    "setproctitle>=1.3.7,<2.0.0",
    "textual-speedups==0.2.1",
    "textual-serve>=1.1.2,<2.0.0",
    "textual[syntax]>=8.2.3,<9.0.0",
    "tree-sitter>=0.24.0,<0.26.0",
    "typeguard==4.4.4",
    "uvicorn>=0.35.0,<0.36.0",
    "watchdog>=6.0.0,<7.0.0",
    "xdg-base-dirs>=6.0.2,<7.0.0",
]

[project.scripts]
localscript = "localscript:main"
localscript-ui = "localscript_ui.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9.0.0",
    "ruff>=0.13.0,<0.14.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "UP"]
ignore = ["E501"]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
